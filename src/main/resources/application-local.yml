# Local/dev profile: in-memory H2 so the app runs with no external database.
# Activate with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Data is reset on every restart. PostgreSQL remains the real/prod target.
spring:
  datasource:
    url: jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # Browse the in-memory DB at http://localhost:8080/h2-console
  # (JDBC URL: jdbc:h2:mem:catalog  user: sa  password: blank)
  h2:
    console:
      enabled: true
